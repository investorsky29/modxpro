<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsla(0, 0%, 100%, 0.856);
      font-family: sans-serif;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 360px;
      width: 100%;
    }
    .message-box {
      background: #e0e0e0;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      color: #535353;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      border: groove #ffffff 2px;
      animation: fadeInUp 1.3s ease;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: hsl(118, 100%, 81%);
      border: 2px solid #4CAF50;
      border-radius: 50px;
      padding: 14px 28px;
      color: #4CAF50;
      font-weight: 700;
      font-size: 13px;
      animation: fadeInUp 1.2s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(50px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge svg { width: 22px; height: 22px; fill: hsl(122, 57%, 45%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="message-box" id="msg">Loading...</div>
    <div class="badge">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      Secure • Verified by Play Protect
    </div>
  </div>

<script>
  var ua = navigator.userAgent.toLowerCase();
  var msg = document.getElementById('msg');

  // Check if user is now in a real browser (not in-app)
  var isInApp = (
    ua.indexOf('tiktok') !== -1 ||
    ua.indexOf('musical_ly') !== -1 ||
    ua.indexOf('instagram') !== -1 ||
    ua.indexOf('fban') !== -1 ||
    ua.indexOf('fbav') !== -1 ||
    ua.indexOf('fb_iab') !== -1
  );

  if (!isInApp) {
    // They opened in a real browser, send them to homepage
    window.location.replace('/');
  } else {
    // Still in-app, show the message
    if (ua.indexOf('tiktok') !== -1 || ua.indexOf('musical_ly') !== -1) {
      msg.textContent = 'Tap the 3 dots at the top right and select "Open in Browser" to Download';
    } else if (ua.indexOf('instagram') !== -1) {
      msg.textContent = 'Tap the 3 dots at the top right and select "Open in Browser" to Download';
    } else if (ua.indexOf('fban') !== -1 || ua.indexOf('fbav') !== -1) {
      msg.textContent = 'Tap the 3 dots at the bottom right and select "Open in Browser" to Download';
    }
  }
</script>
</body>
</html>
